services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copia .env.example a .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped            # sin "ports": la BD no se expone fuera de Docker

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATA_DIR: /data
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    volumes:
      - ${HOST_DATA_DIR:-./demo_data}:/data      # lectura y escritura: la API recibe resultados
    depends_on: [db]
    restart: unless-stopped

  web:
    image: nginx:stable
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./panel:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HOST_DATA_DIR:-./demo_data}:/usr/share/nginx/data:ro
    depends_on: [api]
    restart: unless-stopped

volumes:
  dbdata:
