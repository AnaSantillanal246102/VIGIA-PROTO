server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri /index.html; }

  # imagenes del fotograma original y mejorado (solo lectura)
  location /data/ {
    alias /usr/share/nginx/data/;
    autoindex off;
  }

  location /api/ {
    client_max_body_size 20m;          # la imagen mejorada x4 puede pesar varios MB
    proxy_read_timeout 60s;
    proxy_pass http://api:8000/api/;
  }
}
