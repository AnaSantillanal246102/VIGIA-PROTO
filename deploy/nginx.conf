server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Login para todo el sitio: panel, imagenes y API. Los usuarios viven en
  # deploy/panel.htpasswd (no va a git; se crea con deploy/crear_usuario.sh).
  auth_basic           "VIGIA";
  auth_basic_user_file /etc/nginx/panel.htpasswd;

  # El encabezado lleva el usuario de la sesion para mostrarlo en el panel.
  # (No se usa "return": corre antes del login y responderia sin pedirlo.)
  location / {
    try_files $uri /index.html;
    add_header X-Remote-User $remote_user;
  }

  # imagenes del fotograma original y mejorado (solo lectura)
  location /data/ {
    alias /usr/share/nginx/data/;
    autoindex off;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header X-Remote-User $remote_user;   # quien consulta, para el audit_log pendiente
  }
}
